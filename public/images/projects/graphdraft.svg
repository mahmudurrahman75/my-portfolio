<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <rect width="600" height="360" fill="#0D111D" />
  <rect x="20" y="20" width="560" height="320" rx="12" fill="#131929" stroke="#232C3E" stroke-width="1.5" />
  <rect x="20" y="20" width="560" height="40" rx="12" fill="#182035" />
  <circle cx="44" cy="40" r="5" fill="#EF4444" /><circle cx="62" cy="40" r="5" fill="#F59E0B" /><circle cx="80" cy="40" r="5" fill="#10B981" />
  <text x="300" y="44" text-anchor="middle" font-family="monospace" font-size="12" fill="#8B9BB4">graphdraft :: canvas-diagram-engine</text>
  
  <!-- Canvas Elements with snapping nodes -->
  <g transform="translate(60, 90)">
    <rect width="130" height="60" rx="6" fill="#1B243B" stroke="#6EA8FE" stroke-width="1.5" />
    <text x="65" y="35" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#F4F6FA">API Gateway</text>
  </g>
  <g transform="translate(250, 90)">
    <rect width="130" height="60" rx="6" fill="#1B243B" stroke="#8B5CF6" stroke-width="1.5" />
    <text x="65" y="35" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#F4F6FA">Auth Service</text>
  </g>
  <g transform="translate(420, 150)">
    <rect width="130" height="60" rx="6" fill="#1B243B" stroke="#10B981" stroke-width="1.5" />
    <text x="65" y="35" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#F4F6FA">User DB</text>
  </g>

  <!-- Bezier connector paths -->
  <path d="M190 120 C220 120, 220 120, 250 120" stroke="#6EA8FE" stroke-width="2" />
  <path d="M380 120 C400 120, 400 180, 420 180" stroke="#8B5CF6" stroke-width="2" />
  <circle cx="190" cy="120" r="4" fill="#6EA8FE" />
  <circle cx="250" cy="120" r="4" fill="#6EA8FE" />
  <circle cx="380" cy="120" r="4" fill="#8B5CF6" />
  <circle cx="420" cy="180" r="4" fill="#10B981" />

  <!-- Canvas grid dot pattern in background -->
  <g fill="#253248">
    <circle cx="80" cy="220" r="1.5" /><circle cx="120" cy="220" r="1.5" /><circle cx="160" cy="220" r="1.5" />
    <circle cx="200" cy="220" r="1.5" /><circle cx="240" cy="220" r="1.5" /><circle cx="280" cy="220" r="1.5" />
    <circle cx="80" cy="260" r="1.5" /><circle cx="120" cy="260" r="1.5" /><circle cx="160" cy="260" r="1.5" />
    <circle cx="200" cy="260" r="1.5" /><circle cx="240" cy="260" r="1.5" /><circle cx="280" cy="260" r="1.5" />
  </g>

  <rect x="50" y="270" width="500" height="40" rx="6" fill="#151C2D" />
  <text x="300" y="295" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8B9BB4">Export: SVG • PNG • JSON Schema | Snapping grid 10px | 60 FPS</text>
</svg>
