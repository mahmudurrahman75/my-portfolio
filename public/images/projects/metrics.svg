<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1422" />
      <stop offset="100%" stop-color="#151C30" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#mGrad)" />
  <rect x="20" y="20" width="560" height="320" rx="12" fill="#13192B" stroke="#232C3E" stroke-width="1.5" />
  <!-- Header -->
  <rect x="20" y="20" width="560" height="40" rx="12" fill="#1A2238" />
  <circle cx="44" cy="40" r="5" fill="#EF4444" />
  <circle cx="62" cy="40" r="5" fill="#F59E0B" />
  <circle cx="80" cy="40" r="5" fill="#10B981" />
  <text x="300" y="44" text-anchor="middle" font-family="monospace" font-size="12" fill="#8B9BB4">dev-metrics :: DORA-analytics-v2</text>
  
  <!-- Stat Cards -->
  <g transform="translate(45, 80)">
    <rect width="155" height="75" rx="8" fill="#182035" stroke="#27324A" />
    <text x="15" y="28" font-family="sans-serif" font-size="11" fill="#8B9BB4">DEPLOY FREQUENCY</text>
    <text x="15" y="58" font-family="sans-serif" font-size="22" font-weight="700" fill="#10B981">14.2 / day</text>
  </g>
  <g transform="translate(222, 80)">
    <rect width="155" height="75" rx="8" fill="#182035" stroke="#27324A" />
    <text x="15" y="28" font-family="sans-serif" font-size="11" fill="#8B9BB4">LEAD TIME</text>
    <text x="15" y="58" font-family="sans-serif" font-size="22" font-weight="700" fill="#6EA8FE">42 mins</text>
  </g>
  <g transform="translate(400, 80)">
    <rect width="155" height="75" rx="8" fill="#182035" stroke="#27324A" />
    <text x="15" y="28" font-family="sans-serif" font-size="11" fill="#8B9BB4">CHANGE FAIL RATE</text>
    <text x="15" y="58" font-family="sans-serif" font-size="22" font-weight="700" fill="#38BDF8">&lt; 1.2%</text>
  </g>

  <!-- Line graph -->
  <rect x="45" y="175" width="510" height="140" rx="8" fill="#161E32" stroke="#232C3E" />
  <path d="M60 280 Q 140 250, 200 220 T 320 200 T 420 190 T 530 185" fill="none" stroke="#6EA8FE" stroke-width="3" />
  <path d="M60 280 Q 140 250, 200 220 T 320 200 T 420 190 T 530 185 L 530 300 L 60 300 Z" fill="rgba(110, 168, 254, 0.08)" />
  <circle cx="320" cy="200" r="4" fill="#6EA8FE" />
  <circle cx="530" cy="185" r="4" fill="#10B981" />
  <text x="70" y="200" font-family="sans-serif" font-size="11" font-weight="600" fill="#8B9BB4">Pipeline velocity trend over 30 days</text>
</svg>
