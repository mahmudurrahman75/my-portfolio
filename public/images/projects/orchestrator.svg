<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#141A29" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EA8FE" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bg)" />
  <rect x="20" y="20" width="560" height="320" rx="12" fill="#121726" stroke="#232C3E" stroke-width="1.5" />
  <!-- Window Header -->
  <rect x="20" y="20" width="560" height="40" rx="12" fill="#182033" />
  <circle cx="44" cy="40" r="5" fill="#EF4444" />
  <circle cx="62" cy="40" r="5" fill="#F59E0B" />
  <circle cx="80" cy="40" r="5" fill="#10B981" />
  <text x="300" y="44" text-anchor="middle" font-family="monospace" font-size="12" fill="#8B9BB4">cloud-task-orchestrator :: cluster-active</text>
  
  <!-- Content: Flowchart / Queues -->
  <rect x="50" y="90" width="140" height="80" rx="8" fill="#1C253B" stroke="#6EA8FE" stroke-width="1.5" />
  <text x="120" y="125" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="14" fill="#F4F6FA">Task Ingest</text>
  <text x="120" y="145" text-anchor="middle" font-family="monospace" font-size="11" fill="#6EA8FE">5,420 req/s</text>

  <!-- Arrow -->
  <line x1="190" y1="130" x2="230" y2="130" stroke="#6EA8FE" stroke-width="2" stroke-dasharray="4,4" />

  <rect x="230" y="80" width="140" height="100" rx="8" fill="#1C253B" stroke="#3B82F6" stroke-width="1.5" />
  <text x="300" y="115" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="14" fill="#F4F6FA">Redis Queue</text>
  <text x="300" y="135" text-anchor="middle" font-family="monospace" font-size="11" fill="#10B981">0.8ms P95</text>
  <text x="300" y="155" text-anchor="middle" font-family="monospace" font-size="11" fill="#8B9BB4">3 Active Workers</text>

  <!-- Arrow -->
  <line x1="370" y1="130" x2="410" y2="130" stroke="#6EA8FE" stroke-width="2" stroke-dasharray="4,4" />

  <rect x="410" y="90" width="140" height="80" rx="8" fill="#1C253B" stroke="#8B5CF6" stroke-width="1.5" />
  <text x="480" y="125" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="14" fill="#F4F6FA">Sink / DB</text>
  <text x="480" y="145" text-anchor="middle" font-family="monospace" font-size="11" fill="#8B5CF6">PostgreSQL</text>

  <!-- Telemetry Bar Graph -->
  <rect x="50" y="210" width="500" height="100" rx="8" fill="#161E30" stroke="#232C3E" stroke-width="1" />
  <text x="70" y="235" font-family="sans-serif" font-size="12" font-weight="600" fill="#9DA8BA">Real-time Throughput (jobs/min)</text>
  <!-- Bars -->
  <rect x="70" y="255" width="25" height="35" rx="3" fill="#3B82F6" />
  <rect x="110" y="245" width="25" height="45" rx="3" fill="#6EA8FE" />
  <rect x="150" y="260" width="25" height="30" rx="3" fill="#3B82F6" />
  <rect x="190" y="240" width="25" height="50" rx="3" fill="#6EA8FE" />
  <rect x="230" y="250" width="25" height="40" rx="3" fill="#3B82F6" />
  <rect x="270" y="235" width="25" height="55" rx="3" fill="#6EA8FE" />
  <rect x="310" y="245" width="25" height="45" rx="3" fill="#3B82F6" />
  <rect x="350" y="230" width="25" height="60" rx="3" fill="#6EA8FE" />
  <rect x="390" y="240" width="25" height="50" rx="3" fill="#3B82F6" />
  <rect x="430" y="235" width="25" height="55" rx="3" fill="#6EA8FE" />
  <rect x="470" y="225" width="25" height="65" rx="3" fill="#10B981" />
  <rect x="510" y="228" width="25" height="62" rx="3" fill="#10B981" />
</svg>
